plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hb.cleaner'
    compileSdk 34

    defaultConfig {
        applicationId "com.hb.cleaner"
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
}
